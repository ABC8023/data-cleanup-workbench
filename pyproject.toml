[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "data-cleanup-workbench"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.138,<0.139",
  "uvicorn[standard]>=0.41,<0.42",
  "pydantic>=2.13,<3",
  "pydantic-settings>=2.14,<3",
  "duckdb==1.5.4",
  "pyarrow>=19,<21",
  "ijson>=3.4,<4",
  "openpyxl>=3.1,<4",
  "rapidfuzz>=3.14,<4",
  "python-multipart>=0.0.22,<0.1",
  "jinja2>=3.1,<4",
  "pyyaml>=6,<7",
  "keyring>=25,<26",
  "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "hypothesis>=6,<7", "ruff>=0.12,<1", "mypy>=1.18,<2"]

[tool.hatch.build.targets.wheel]
packages = ["backend/src/data_workbench"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
